name: magpie_dafeiyu
description: 蓝色大肥鱼 · Magpie 桌宠伴侣（Flutter 桌面版）
publish_to: 'none'
version: 0.1.8+18

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  window_manager: ^0.7.1
  tray_manager: ^0.9.1
  flutter_acrylic: ^1.1.4
  http: ^1.6.0
  crypto: ^3.0.8
  path: ^1.9.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  archive: ^4.0.7
  nativeapi: ^0.6.2
  flutter_svg: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/pet/
    - assets/brand/
    - assets/provider-icons/
