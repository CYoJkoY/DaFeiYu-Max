name: Release

on:
  push:
    branches: [main]
    tags: ['v0.1.*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release (main only)
        type: boolean
        default: false

concurrency:
  group: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish_release)) && format('package-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      should_release: ${{ steps.plan.outputs.should_release }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          FULL="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          VERSION="${FULL%%+*}"
          TAG="v$VERSION"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! printf '%s' "$VERSION" | grep -Eq '^0\.1\.[0-9]+$'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is not a 0.1.x release; nothing to do."
            exit 1
          fi
          if ! grep -q "appVersion = '$FULL'" lib/core/version.dart; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "lib/core/version.dart does not report $FULL; bump both files together."
            exit 1
          fi
          if [ "$EVENT" = 'pull_request' ] || { [ "$EVENT" = 'workflow_dispatch' ] && [ "$PUBLISH_RELEASE" != 'true' ]; }; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Building archives without publishing a release."
            exit 0
          fi
          if [ "$EVENT" = 'workflow_dispatch' ] && { [ "$REF_TYPE" != 'branch' ] || [ "$REF_NAME" != 'main' ]; }; then
            echo "Manual publishing requires the main branch."
            exit 1
          fi
          if [ "$EVENT" = 'push' ] && [ "$REF_TYPE" = 'tag' ]; then
            if [ "$REF_NAME" != "$TAG" ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Tag $REF_NAME does not match pubspec.yaml version $VERSION."
              exit 1
            fi
            if gh api "repos/$REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists; nothing to do."
              exit 0
            fi
            MODE="verify-tag"
          else
            if [ "$REF_NAME" != 'main' ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Push to $REF_NAME does not trigger releases; only main does."
              exit 0
            fi
            if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists; nothing to do."
              exit 0
            fi
            if gh api "repos/$REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists; nothing to do."
              exit 0
            fi
            MODE="create-at-sha"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Planned $TAG release ($MODE)."

  build:
    name: package (${{ matrix.platform }}/${{ matrix.arch }})
    needs: preflight
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish_release) || needs.preflight.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Download packages
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows app
        if: matrix.platform == 'win32'
        run: flutter build windows --release

      - name: Package portable Windows ZIP
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $ReleaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$ReleaseDir/BlueDaFeiYu.exe")) {
            throw "BlueDaFeiYu.exe is missing from the Windows build."
          }
          $Zip = "magpie-DaFeiYu-$env:RELEASE_TAG-Windows-x64.zip"
          if (Test-Path -LiteralPath $Zip) { Remove-Item -LiteralPath $Zip }
          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath $Zip
          Get-Item -LiteralPath $Zip | Select-Object Name, Length

      - name: Build macOS app
        if: matrix.platform == 'darwin'
        run: flutter build macos --release

      - name: Ad-hoc sign and package macOS app
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/BlueDaFeiYu.app"
          test -d "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/BlueDaFeiYu")" = "arm64"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/蓝色大肥鱼.app"
          codesign --force --deep --sign - "$STAGE/蓝色大肥鱼.app"
          codesign --verify --deep --strict "$STAGE/蓝色大肥鱼.app"
          ditto -c -k -X --keepParent --zlibCompressionLevel 9 \
            "$STAGE/蓝色大肥鱼.app" \
            "magpie-DaFeiYu-${RELEASE_TAG}-macOS-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: magpie-DaFeiYu-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: [preflight, build]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      MODE: ${{ needs.preflight.outputs.mode }}
      SHA: ${{ github.sha }}
      MAC_ZIP: magpie-DaFeiYu-${{ needs.preflight.outputs.release_tag }}-macOS-arm64.zip
      WIN_ZIP: magpie-DaFeiYu-${{ needs.preflight.outputs.release_tag }}-Windows-x64.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify archive shapes and checksum both files
        run: |
          set -euo pipefail
          test -f "dist/$MAC_ZIP"
          test -f "dist/$WIN_ZIP"
          unzip -l "dist/$WIN_ZIP" | grep -q 'BlueDaFeiYu.exe'
          unzip -l "dist/$MAC_ZIP" | grep -q '蓝色大肥鱼.app/Contents/MacOS/BlueDaFeiYu'
          (cd dist && sha256sum "$MAC_ZIP" "$WIN_ZIP" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG")
          if [ "$MODE" = 'verify-tag' ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$SHA")
          fi
          gh "${args[@]}" --latest \
            --title "$RELEASE_TAG · 蓝色大肥鱼 macOS × Windows · Magpie" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            "dist/$MAC_ZIP" "dist/$WIN_ZIP" dist/SHA256SUMS.txt
