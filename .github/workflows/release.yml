name: Release

on:
  push:
    branches: [main]
    tags: ['v0.1.*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release (main only)
        type: boolean
        default: false

concurrency:
  group: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish_release)) && format('package-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      should_release: ${{ steps.plan.outputs.should_release }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(node scripts/version.ts)"
          TAG="v$VERSION"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! printf '%s' "$VERSION" | grep -Eq '^0\.1\.[0-9]+$'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is not a 0.1.x release; nothing to do."
            exit 1
          fi
          if [ "$EVENT" = 'pull_request' ] || { [ "$EVENT" = 'workflow_dispatch' ] && [ "$PUBLISH_RELEASE" != 'true' ]; }; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Building archives without publishing a release."
            exit 0
          fi
          if [ "$EVENT" = 'workflow_dispatch' ] && { [ "$REF_TYPE" != 'branch' ] || [ "$REF_NAME" != 'main' ]; }; then
            echo "Manual publishing requires the main branch."
            exit 1
          fi
          if [ "$EVENT" = 'push' ] && [ "$REF_TYPE" = 'tag' ]; then
            if [ "$REF_NAME" != "$TAG" ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Tag $REF_NAME does not match package.json version $VERSION."
              exit 1
            fi
            if gh api "repos/$REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists; nothing to do."
              exit 0
            fi
            MODE="verify-tag"
          else
            if [ "$REF_NAME" != 'main' ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Push to $REF_NAME does not trigger releases; only main does."
              exit 0
            fi
            if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists; nothing to do."
              exit 0
            fi
            if gh api "repos/$REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists; nothing to do."
              exit 0
            fi
            MODE="create-at-sha"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Planned $TAG release ($MODE)."

  build:
    name: package (${{ matrix.platform }}/${{ matrix.arch }})
    needs: preflight
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish_release) || needs.preflight.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            petkit: petkit
            packaged_petkit: dist/蓝色大肥鱼-darwin-arm64/蓝色大肥鱼.app/Contents/Resources/app/dist/native/petkit
          - os: windows-latest
            platform: win32
            arch: x64
            petkit: petkit.exe
            packaged_petkit: dist/蓝色大肥鱼-win32-x64/resources/app/dist/native/petkit.exe
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: npm ci --ignore-scripts
      - name: Prepare animation catalog
        run: npm run prepare
      - name: Download and verify animation assets
        run: npm run assets
      - name: Typecheck TypeScript
        run: npm run typecheck
      - name: Generate icons from the brand PNG masters
        run: npm run icons
      - name: Build Zig native sidecar (native CPU baseline)
        working-directory: native
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline
      - name: Build TypeScript into dist/
        run: npm run build
      - name: Run Zig tests
        working-directory: native
        run: zig build test
      - name: Run TypeScript and Node tests
        run: npm test
      - name: Check downloaded animation assets
        run: npm run check
      - name: Verify petkit landed in dist/native
        shell: bash
        run: test -f "dist/native/${{ matrix.petkit }}"
      - run: node scripts/package.ts --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Smoke-test packaged petkit
        run: node scripts/smoke-petkit.ts --binary "${{ matrix.packaged_petkit }}"
      - name: Verify and archive macOS app
        if: matrix.platform == 'darwin'
        run: |
          test "$RELEASE_TAG" = "v$(node scripts/version.ts)"
          APP="dist/蓝色大肥鱼-darwin-arm64/蓝色大肥鱼.app"
          codesign --verify --deep --strict "$APP"
          test -f "$APP/Contents/Resources/app/assets/tray-icon.png"
          test -x "$APP/Contents/Resources/app/dist/native/petkit"
          ditto -c -k -X --keepParent --zlibCompressionLevel 9 "$APP" "dist/magpie-DaFeiYu-${RELEASE_TAG}-macOS-arm64.zip"
          node scripts/verify-archives.ts --platform darwin "dist/magpie-DaFeiYu-${RELEASE_TAG}-macOS-arm64.zip"
      - name: Verify Windows archive
        if: matrix.platform == 'win32'
        shell: bash
        run: node scripts/verify-archives.ts --platform win32 "dist/magpie-DaFeiYu-${RELEASE_TAG}-Windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: [preflight, build]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      MODE: ${{ needs.preflight.outputs.mode }}
      SHA: ${{ github.sha }}
      MAC_ZIP: magpie-DaFeiYu-${{ needs.preflight.outputs.release_tag }}-macOS-arm64.zip
      WIN_ZIP: magpie-DaFeiYu-${{ needs.preflight.outputs.release_tag }}-Windows-x64.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify and checksum both archives
        run: |
          set -euo pipefail
          test -f "dist/$MAC_ZIP"
          test -f "dist/$WIN_ZIP"
          node scripts/verify-archives.ts "dist/$MAC_ZIP" "dist/$WIN_ZIP"
          (cd dist && sha256sum "$MAC_ZIP" "$WIN_ZIP" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG")
          if [ "$MODE" = 'verify-tag' ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$SHA")
          fi
          gh "${args[@]}" --latest \
            --title "$RELEASE_TAG · 蓝色大肥鱼 macOS × Windows · Magpie" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            "dist/$MAC_ZIP" "dist/$WIN_ZIP" dist/SHA256SUMS.txt
