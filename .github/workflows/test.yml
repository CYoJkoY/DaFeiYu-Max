name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      # `nativeapi` builds a small native asset on Linux and needs the GTK 3
      # and X11 development headers; the desktop targets themselves are only
      # built for Windows and macOS.
      - name: Install Linux desktop headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libx11-dev libxi-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Download packages
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run tests
        run: flutter test
