name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Prepare animation catalog
        run: npm run prepare

      - name: Generate icons from the brand PNG masters
        run: npm run icons

      - name: Build Zig native layer (petkit)
        working-directory: native
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: Run Zig tests
        working-directory: native
        run: zig build test

      - name: Build TypeScript into dist/
        run: npm run build

      - name: Smoke-test petkit ping
        run: node scripts/smoke-petkit.ts

      - name: Run tests against dist/
        run: npm test

      - name: Check packaged runtime inputs
        run: node scripts/verify-build.ts

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
